name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run check

  build-war:
    name: Build WAR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install --yes ant

      - name: Build WAR
        working-directory: etc/build
        run: ant war

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: draw-war
          path: build/draw.war
          if-no-files-found: error
          retention-days: 7
